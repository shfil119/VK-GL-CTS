name: Build and Pack VK-GL-CTS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-cts:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Inline Dockerfile
        run: |
          cat << 'EOF' > Dockerfile
          # ==========================================
          # Stage 1: Build Environment & Compilation
          # ==========================================
          FROM ubuntu:22.04 AS builder
          ENV DEBIAN_FRONTEND=noninteractive

          RUN apt-get update && apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build git python3 python3-pip \
              libpng-dev libz-dev libx11-dev libxcb1-dev libxrender-dev \
              libvulkan-dev ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /opt
          RUN git clone --depth=1 https://github.com vk-gl-cts

          WORKDIR /opt/vk-gl-cts
          RUN python3 external/fetch_sources.py

          RUN mkdir build && cd build && \
              cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DDEQP_TARGET=null \
              -DSELECTED_BUILD_TARGETS="deqp-vk;deqp-gles2;deqp-gles3;glcts" && \
              ninja

          # ==========================================
          # Stage 2: Extraction Step
          # ==========================================
          FROM scratch AS exporter
          COPY --from=builder /opt/vk-gl-cts/build/external/vulkancts/modules/vulkan/deqp-vk /
          COPY --from=builder /opt/vk-gl-cts/build/external/openglcts/modules/glcts /
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CTS inside Docker container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: vk-gl-cts-builder:latest
          outputs: type=local,dest=./build-output
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Tarball Artifact
        run: |
          cd build-output
          tar -czf ../vk-gl-cts-linux-x86_64.tar.gz .
          cd ..

      - name: Upload Packaged Binaries
        uses: actions/upload-artifact@v4
        with:
          name: vk-gl-cts-linux-x86_64
          path: vk-gl-cts-linux-x86_64.tar.gz
          retention-days: 14
