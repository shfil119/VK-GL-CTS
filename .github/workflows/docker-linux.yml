name: Build and Pack VK-GL-CTS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-cts:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CTS inside Ubuntu Container via Docker Run
        run: |
          # Tworzymy katalog na pliki wynikowe na hoście
          mkdir -p ${{ github.workspace }}/build-output

          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ubuntu:22.04 \
            /bin/bash -c "
              set -e
              
              # 1. Aktualizacja pakietów i instalacja zależności
              apt-get update && apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build git python3 python3-pip \
                libpng-dev libz-dev libx11-dev libxcb1-dev libxrender-dev \
                libvulkan-dev ca-certificates
              
              # 3. Pobieranie zewnętrznych źródeł skryptem Khronos
              python3 external/fetch_sources.py
              
              # 4. Konfiguracja i kompilacja
              mkdir build && cd build
              cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DDEQP_TARGET=null \
                -DSELECTED_BUILD_TARGETS='deqp-vk;deqp-gles2;deqp-gles3;glcts'
              ninja
              
              # 5. Kopiowanie gotowych binariów do zmapowanego wolumenu hosta
              cp -r external/vulkancts/modules/vulkan/deqp-vk /work/build-output/
              cp -r external/openglcts/modules/glcts /work/build-output/
            "

      - name: Fix Permissions, Pack and Compress
        run: |
          # Zmiana uprawnień plików (proces wewnątrz kontenera działa jako root)
          sudo chown -R $USER:$USER ${{ github.workspace }}/build-output
          
          cd build-output
          tar -czf ../vk-gl-cts-linux-x86_64.tar.gz .
          cd ..

      - name: Upload Packaged Binaries
        uses: actions/upload-artifact@v4
        with:
          name: vk-gl-cts-linux-x86_64
          path: vk-gl-cts-linux-x86_64.tar.gz
          retention-days: 14
