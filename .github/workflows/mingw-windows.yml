name: Windows MinGW Build via Docker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-mingw-docker:
    runs-on: ubuntu-latest
    
    container:
      image: ubuntu:22.04

    steps:
    - name: Install System Prerequisites
      run: |
        apt-get update
        apt-get install -y git python3

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch External Sources (VK-GL-CTS Dependencies)
      run: |
        python3 external/fetch_sources.py

    - name: Install MinGW and Build Tools inside Container
      run: |
        apt-get install -y mingw-w64 ninja-build cmake

    - name: Setup MinGW Toolchain File
      run: |
        cat << 'EOF' > toolchain-mingw64.cmake
        set(CMAKE_SYSTEM_NAME Windows)
        set(CMAKE_SYSTEM_PROCESSOR x86_64)
        set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc)
        set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
        set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
        set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32)
        set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
        set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
        set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
        EOF

    - name: Configure Build
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=toolchain-mingw64.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DDE_MINGW=ON

    - name: Compile Project
      run: |
        cmake --build build --parallel $(nproc)

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vk-gl-cts-mingw-docker-windows
        path: |
          build/**/*.exe
          build/**/*.dll
